<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily English</title>
<style>
:root{--bg:#f6f1e8;--ink:#1c1915;--muted:#6b645b;--card:#fffdf8;--line:#e6ddd0;--accent:#c45c26}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:40rem;margin:0 auto;padding:1.25rem 1.1rem 3rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:1.45rem;margin:.2rem 0 .15rem}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 1rem}
.today{display:block;background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:1rem 1.1rem;color:inherit;text-decoration:none;margin-bottom:1.1rem}
.today strong{display:block;font-size:1.15rem;margin:.15rem 0}
.today span{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:.15rem .5rem}
details{margin-top:.3rem}
summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:.4rem 0}
.arch{list-style:none;padding:0;margin:.4rem 0 0}
.arch a{display:flex;justify-content:space-between;gap:.8rem;padding:.45rem 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:.92rem}
.arch span{color:var(--muted);font-size:.8rem;flex-shrink:0}
</style>
</head>
<body>
<main>
  <div class="kicker">Daily English</div>
  <h1>今日のレッスン</h1>
  <p class="sub">15–18分。開いたらすぐ始められる。</p>
  <a class="today" href="lessons/2026-08-25.html">
    <span class="badge">Today</span>
    <strong>Wrapping up the day</strong>
    <span>Quiet evening. Review: wrap up, just in case.</span>
  </a>
  <details>
    <summary>過去のレッスン</summary>
    <ul class="arch">
      <li><a href="lessons/2026-08-24.html">Heading out in the morning <span>8/24</span></a></li>
      <li><a href="lessons/2026-08-23.html">A low-key morning <span>8/23</span></a></li>
      <li><a href="lessons/thicker-demo.html">Running a few errands <span>demo</span></a></li>
      <li><a href="lessons/coffee.html">At a café</a></li>
      <li><a href="lessons/weather.html">Talking about the weather</a></li>
    </ul>
  </details>
</main>
</body>
</html>

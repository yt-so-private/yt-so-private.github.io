<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="AIの公開ニュース、ラインナップ、ハーネス、予定、用途別の目安、ベンチマークの読み方。個人を特定できる情報は載せていません。">
<meta name="theme-color" id="theme-color" content="#f4f0e6">
<title>AI ラインナップと比較</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("ai-news-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<style>
html{background:#f4f0e6;color-scheme:light}
html[data-theme="dark"]{background:#131311;color-scheme:dark}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#131311;color-scheme:dark}}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<a class="skip" href="#main">本文へ</a>
<div class="wrap">
<header class="mast">
  <div class="brand">
    <p class="kicker">公開メモ</p>
    <h1>AI ラインナップと比較</h1>
  </div>
  <button type="button" class="theme" id="theme" aria-label="表示は自動（端末の設定）です。押すとライトに切り替えます">自動</button>
  <p class="sub" id="updated" aria-live="polite">読み込み中…</p>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="セクション">
  <button type="button" role="tab" id="tab-news" data-tab="news" aria-selected="true" aria-controls="news" tabindex="0">今日のニュース</button>
  <button type="button" role="tab" id="tab-lineups" data-tab="lineups" aria-selected="false" aria-controls="lineups" tabindex="-1">ラインナップ</button>
  <button type="button" role="tab" id="tab-harnesses" data-tab="harnesses" aria-selected="false" aria-controls="harnesses" tabindex="-1">ハーネス</button>
  <button type="button" role="tab" id="tab-upcoming" data-tab="upcoming" aria-selected="false" aria-controls="upcoming" tabindex="-1">予定</button>
  <button type="button" role="tab" id="tab-rankings" data-tab="rankings" aria-selected="false" aria-controls="rankings" tabindex="-1">用途</button>
  <button type="button" role="tab" id="tab-benchmarks" data-tab="benchmarks" aria-selected="false" aria-controls="benchmarks" tabindex="-1">読み方</button>
</nav>
<main id="main">
  <section id="news" class="panel on" role="tabpanel" aria-labelledby="tab-news" tabindex="0">
    <p class="panel-note">読み込み中…</p>
  </section>
  <section id="lineups" class="panel" role="tabpanel" aria-labelledby="tab-lineups" tabindex="0" hidden>
    <p class="panel-note">読み込み中…</p>
  </section>
  <section id="harnesses" class="panel" role="tabpanel" aria-labelledby="tab-harnesses" tabindex="0" hidden>
    <p class="panel-note">読み込み中…</p>
  </section>
  <section id="upcoming" class="panel" role="tabpanel" aria-labelledby="tab-upcoming" tabindex="0" hidden>
    <p class="panel-note">読み込み中…</p>
  </section>
  <section id="rankings" class="panel" role="tabpanel" aria-labelledby="tab-rankings" tabindex="0" hidden>
    <p class="panel-note">読み込み中…</p>
  </section>
  <section id="benchmarks" class="panel" role="tabpanel" aria-labelledby="tab-benchmarks" tabindex="0" hidden>
    <p class="panel-note">読み込み中…</p>
  </section>
</main>
<footer>公開ページ。個人を特定できる情報は載せていません。</footer>
</div>
<noscript><p class="banner">表示には JavaScript が必要です。</p></noscript>
<script src="ui.js"></script>
</body>
</html>

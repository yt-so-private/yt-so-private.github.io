<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI digest</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<main>
  <div class="kicker">Weekday digest</div>
  <h1>AI news</h1>
  <p class="sub" id="updated">読み込み中…</p>
  <nav class="tabs" role="tablist">
    <button type="button" class="on" data-tab="news">ニュース</button>
    <button type="button" data-tab="lineups">ラインナップ</button>
    <button type="button" data-tab="harnesses">ハーネス</button>
    <button type="button" data-tab="upcoming">予定</button>
    <button type="button" data-tab="rankings">用途</button>
    <button type="button" data-tab="benchmarks">読み方</button>
  </nav>
  <section id="news" class="panel on"></section>
  <section id="lineups" class="panel"></section>
  <section id="harnesses" class="panel"></section>
  <section id="upcoming" class="panel"></section>
  <section id="rankings" class="panel"></section>
  <section id="benchmarks" class="panel"></section>
  <footer>公開ページ。個人情報は載せない。</footer>
</main>
<script src="ui.js"></script>
</body>
</html>
